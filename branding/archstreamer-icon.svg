<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ArchStreamer">
  <!--
    Canonical ArchStreamer mark (stream arcs + pad).
    Source of truth for Flatpak/desktop and Android launcher exports.
    Palette: ink tile, theme green signal, amber pad.
  -->
  <rect width="128" height="128" rx="28" fill="#121816"/>
  <!-- stream arcs -->
  <path d="M42 36c14-12 30-12 44 0" fill="none" stroke="#2E7D4F" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M50 47c9-7 19-7 28 0" fill="none" stroke="#3FA86A" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="56" r="4.5" fill="#5BC87E"/>
  <!-- gamepad -->
  <rect x="28" y="66" width="72" height="38" rx="15" fill="#E8A54B"/>
  <!-- left stick -->
  <circle cx="46" cy="85" r="7" fill="#121816"/>
  <!-- d-pad -->
  <rect x="74" y="80" width="18" height="6" rx="2" fill="#121816"/>
  <rect x="80" y="74" width="6" height="18" rx="2" fill="#121816"/>
</svg>

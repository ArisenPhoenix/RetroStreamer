# Example host_runner config for remote hosts.
# Start scripts pass runtime instance values such as ports, virtual-display, and GPU.
# CLI arguments override values from this file.

rom-root=/home/alina/roms
# meta-root=/home/alina/roms/../Meta
# art-root=/home/alina/roms/../Art
save-root=/home/alina/.local/share/archstreamer/saves
log-root=/home/alina/archstreamer-logs

clients=2
allow-new-users=true
player-reconnect-timeout=60

